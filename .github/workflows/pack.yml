# Valida el resource pack en cada push/PR y adjunta el zip a las releases.
# QUE HACE: tools/validar_pack.py (JSON, referencias item->modelo->textura, pack.mcmeta vs tabla de versiones hasta 26.2)
#           y tools/build.py (zip reproducible + SHA-1/SHA-256). En una release de GitHub sube el zip como asset.
name: Pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validar-y-empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validar el pack
        run: python3 tools/validar_pack.py pack
      - name: Empaquetar
        run: python3 tools/build.py | tee build.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resourcepack
          path: dist/*.zip
      - name: Adjuntar a la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
