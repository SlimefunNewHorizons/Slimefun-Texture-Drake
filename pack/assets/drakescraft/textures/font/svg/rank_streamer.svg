<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 44" width="212" height="44">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A1080"/>
      <stop offset="55%" stop-color="#350959"/>
      <stop offset="100%" stop-color="#29063D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
