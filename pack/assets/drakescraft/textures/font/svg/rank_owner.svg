<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" width="160" height="44">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B0B7A"/>
      <stop offset="55%" stop-color="#350959"/>
      <stop offset="100%" stop-color="#22053B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF2A6"/>
      <stop offset="38%" stop-color="#FFD700"/>
      <stop offset="72%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6414"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFF3A1"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Outer dark silhouette for crisp contrast on any chat background -->
  <rect x="6" y="2" width="148" height="40" rx="7" fill="#120420"/>

  <!-- Golden Greek metallic frame -->
  <rect x="8" y="3.5" width="144" height="37" rx="6" fill="url(#goldGrad)"/>

  <!-- Royal purple interior plaque -->
  <rect x="11" y="6.5" width="138" height="31" rx="4" fill="url(#bgGrad)"/>

  <!-- Subtle top glossy sheen -->
  <rect x="12" y="7" width="136" height="12" rx="3" fill="#FFFFFF" opacity="0.10"/>

  <!-- Greek meander trim -->
  <rect x="18" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="22" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="30" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="34" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="42" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="46" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="54" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="58" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="66" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="70" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="78" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="82" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="90" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="94" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="102" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="106" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="114" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="118" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/><rect x="126" y="5" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="130" y="7" width="2" height="2" fill="#D4AF37" opacity="0.45"/>
  <rect x="18" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="30" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="42" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="54" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="66" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="78" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="90" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="102" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="114" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/><rect x="126" y="37" width="6" height="2" fill="#FFD700" opacity="0.55"/>

  <!-- Golden laurel accents -->
  <path d="M5,22 C2,17 4,11 9,9 C7,14 7,17 8,22 C7,27 7,30 9,35 C4,33 2,27 5,22 Z" fill="url(#goldGrad)" stroke="#1A0529" stroke-width="1"/><ellipse cx="6" cy="14" rx="2.2" ry="3.5" transform="rotate(-25 6 14)" fill="#FFD700"/><ellipse cx="6" cy="30" rx="2.2" ry="3.5" transform="rotate(25 6 30)" fill="#FFD700"/>
  <path d="M155,22 C158,17 156,11 151,9 C153,14 153,17 152,22 C153,27 153,30 151,35 C156,33 158,27 155,22 Z" fill="url(#goldGrad)" stroke="#1A0529" stroke-width="1"/><ellipse cx="154" cy="14" rx="2.2" ry="3.5" transform="rotate(25 154 14)" fill="#FFD700"/><ellipse cx="154" cy="30" rx="2.2" ry="3.5" transform="rotate(-25 154 30)" fill="#FFD700"/>

  <!-- Emblem medallion socket -->
  <circle cx="27" cy="22" r="11" fill="#1A052E" stroke="#D4AF37" stroke-width="1.5"/>
  <g transform="translate(17.5, 12.5) scale(1.18)">
    <path d="M1 12 L2.5 5 L5.5 8.5 L8 3 L10.5 8.5 L13.5 5 L15 12 Z" fill="#FFD700" stroke="#1A0529" stroke-width="1"/><rect x="2" y="12.2" width="12" height="2" rx="0.6" fill="#FFF3A1"/>
  </g>

  <!-- Rank label with hard drop shadow -->
  <text x="92" y="29.5" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-weight="900" font-size="21" letter-spacing="1.2" fill="#12031F">DUEÑO</text>
  <text x="92" y="28" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-weight="900" font-size="21" letter-spacing="1.2" fill="url(#textGrad)">DUEÑO</text>
